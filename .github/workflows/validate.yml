name: Check Design Library
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the self-contained published snapshot
        run: |
          python3 -m unittest discover -s tests -v
          node tests/test_library_routes.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Review desktop and mobile previews
        run: |
          python3 -m http.server 8765 > /tmp/design-library-server.log 2>&1 &
          library_review_status=0
          node tests/check_buttons.cjs || library_review_status=$?
          node tests/check_optimizations.cjs || library_review_status=$?
          node tests/check_layout.cjs || library_review_status=$?
          exit "$library_review_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-library-browser-review
          path: browser-review/
          retention-days: 14
